<!-- Igongo email signature. Fill the {{...}} values per person, and
     point the image at the hosted copy of email-signature-logo@2x.png. -->
<table cellpadding="0" cellspacing="0" border="0" style="font-family:Lato,Arial,sans-serif;font-size:13px;color:#000000;">
  <tr>
    <td style="padding-right:14px;border-right:2px solid #B8292F;vertical-align:top;">
      <img src="{{logo_url}}" width="54" alt="Igongo" style="display:block;border:0;">
    </td>
    <td style="padding-left:14px;vertical-align:top;line-height:1.45;">
      <strong style="font-size:15px;">{{full_name}}</strong><br>
      <span style="color:#B8292F;font-weight:bold;">{{role}}</span><br>
      Igongo Country Hotel &amp; Cultural Centre<br>
      <span style="color:#665C56;">T</span> {{phone}} &nbsp;
      <span style="color:#665C56;">E</span> {{email}}<br>
      <a href="https://igongo.co.ug" style="color:#B8292F;text-decoration:none;font-weight:bold;">igongo.co.ug</a>
    </td>
  </tr>
</table>
