# Manual job (run from the Actions tab or with workflow_dispatch) that re-makes
# the app's screenshot images on Linux with the pinned Flutter, then commits
# only the changed images back to the branch it runs on:
#   - apps/igongo/test/golden/goldens (the key screens, light and dark)
#   - packages/brand/store/screenshots (the store listing screens)
# Use it after a visual change (for example the guest bottom bar) so the
# images match on Linux. Review the new images in the pull request afterwards.
name: App goldens (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

# One regeneration at a time per branch.
concurrency:
  group: app-goldens-${{ github.ref }}
  cancel-in-progress: false

env:
  # The same Flutter as app.yml, so the images match what CI compares against.
  FLUTTER_VERSION: 3.50.1

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      # Step 1: the branch this run was started on, with its full history.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      # Step 2: the pinned Flutter, as app.yml uses it.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Step 3: packages for the app.
      - run: flutter pub get
        working-directory: apps/igongo
      # Step 4: run every test and save the new images in place of the old ones.
      - run: flutter test --update-goldens
        working-directory: apps/igongo
      # Step 5: commit only the changed images (in the golden folder and the store screenshots), if any.
      - name: Commit regenerated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- apps/igongo/test/golden packages/brand/store
          if git diff --cached --quiet; then
            echo "No image changed."
          else
            git commit -m "Regenerate app screenshots on Linux (Flutter 3.50.1)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
