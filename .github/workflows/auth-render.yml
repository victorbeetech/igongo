# TEMPORARY: renders the Sign in and Create account screens on Linux with the
# pinned Flutter, and commits the pictures back to this branch so they can be
# reviewed. Delete this file and apps/igongo/test/render once the screens are approved.
name: Auth render (temporary)

on:
  push:
    branches: [claude/auth-hero-fix]
    paths:
      - apps/igongo/lib/shared/ui/auth/**
      - apps/igongo/lib/modules/m00_app_shell/presentation/sign_in/**
      - apps/igongo/lib/modules/m00_app_shell/presentation/create_account/**
      - .github/workflows/auth-render.yml

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # Step 1: get the branch with write access so the pictures can be committed back.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      # Step 2: install the pinned Flutter.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Step 3: make the two pictures.
      - name: Render the Auth screens
        working-directory: apps/igongo
        env:
          AUTH_RENDER: "1"
        run: |
          flutter pub get
          flutter test --update-goldens test/render/auth_render_test.dart
      # Step 4: commit the pictures back to this branch.
      - name: Commit the pictures
        working-directory: apps/igongo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add test/render/goldens
          git commit -m "Add Auth screen renders for review" || echo "No change"
          # Bring in any newer commit on the branch first, so the push is not refused.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
