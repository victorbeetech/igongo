# Checks and builds for the Igongo app (apps/igongo, Flutter) on every pull
# request and push to main that touches the app or the packages it uses:
#   1. app-check: flutter analyze (strict) and every test, goldens included
#   2. android: a debug APK, saved as a download on the run's page
#   3. ios:     a release build without signing, to prove it compiles on a Mac
# Signing and store uploads happen on the owner's Mac (docs/MAC-STEPS.md).
# No secrets are used here.
name: App

on:
  pull_request:
    paths:
      - apps/igongo/**
      - packages/brand/**
      - packages/design-tokens/**
      - .github/workflows/app.yml
  push:
    branches: [main]
    paths:
      - apps/igongo/**
      - packages/brand/**
      - packages/design-tokens/**
      - .github/workflows/app.yml
  # Run by hand from the Actions tab (or with the API) on a branch. Set
  # regenerate to true to re-make the screenshot images on Linux and commit
  # only the changed images back to that branch (see the regenerate job).
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Re-make the screenshot images on Linux and commit them to this branch"
        type: boolean
        default: false

# A newer push to the same branch cancels the older run.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so the golden pictures match. Change it with the goldens.
  FLUTTER_VERSION: 3.50.1

defaults:
  run:
    working-directory: apps/igongo

jobs:
  app-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # MapLibre's Android library compiles for Java 21, so the build needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: igongo-debug-apk
          path: apps/igongo/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build ios --release --no-codesign

  # Manual only: re-makes the app's screenshot images on Linux with the pinned
  # Flutter, then commits only the changed images to the branch this run is on:
  #   - apps/igongo/test/golden/goldens (the key screens, light and dark)
  #   - packages/brand/store/screenshots (the store listing screens)
  # Review the new images in the pull request afterwards.
  regenerate:
    if: github.event_name == 'workflow_dispatch' && inputs.regenerate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: the branch this run was started on, with its full history.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      # Step 2: the pinned Flutter, as the jobs above use it.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Step 3: packages for the app.
      - run: flutter pub get
      # Step 4: run every test and save the new images in place of the old ones.
      - run: flutter test --update-goldens
      # Step 5: commit only the changed images (golden folder and store screenshots), if any.
      - name: Commit regenerated images
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- apps/igongo/test/golden packages/brand/store
          if git diff --cached --quiet; then
            echo "No image changed."
          else
            git commit -m "Regenerate app screenshots on Linux (Flutter 3.50.1)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
