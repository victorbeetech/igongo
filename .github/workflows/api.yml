# Checks for the API back end on every pull request and push to main:
# lint and type checks with warnings as errors, and every module's tests
# (each on a real Postgres in memory). Also checks that the bundled
# migrations match the module migration files.
name: API

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundled migrations are up to date
        run: pnpm --filter @igongo/api gen:migrations && git diff --exit-code apps/api/src/migrations
      - name: Lint and type check
        run: pnpm --filter "@igongo/core" --filter "@igongo/audit-trail" --filter "@igongo/roles-permissions" --filter "@igongo/users-login" --filter "@igongo/super-admin" --filter "@igongo/api" lint
      - name: Tests
        run: pnpm --filter "@igongo/core" --filter "@igongo/audit-trail" --filter "@igongo/roles-permissions" --filter "@igongo/users-login" --filter "@igongo/super-admin" --filter "@igongo/api" test
