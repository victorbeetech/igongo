# The Igongo app: one app for every person (staff, managers, riders and
# guests), with screens built from the person's roles. This phase is the
# clickable UI with sample data only; no back end or real functions yet.
name: igongo
description: Igongo Country Hotel & Cultural Centre, one app for staff and guests.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  go_router: ^18.1.4
  flutter_svg: ^2.5.0
  igongo_tokens:
    path: ../../packages/design-tokens
  igongo_brand:
    path: ../../packages/brand
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.4
  http: ^1.6.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  nfc_manager: ^4.4.0
  image_picker: ^1.2.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  maplibre_gl: ^0.28.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Images the app shows, such as the hut photo on the Auth screens.
    - assets/images/auth_hut.jpg
    # Brand logos for the Google and Apple sign-in buttons, drawn from the design.
    - assets/images/google_logo.svg
    - assets/images/apple_logo.svg
    # The owner's own photos (see lib/shared/ui/photo/guest_photos.dart).
    - assets/photos/
    # Cart artwork from the design mock-up (empty cart state).
    - assets/cart/cart-illustration.png
